name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # macOS like the target users; WeasyPrint needs pango from Homebrew.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pango
        run: brew install pango
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib" uv run pytest -q

  audit:
    # Fails on known vulnerabilities in the locked runtime dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Audit locked runtime dependencies
        run: |
          uv export --no-dev --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  docker:
    # Builds the image Glama uses and checks the server answers over stdio and WeasyPrint renders a PDF.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ucetka-mcp .
      - name: MCP handshake over stdio
        # Keeps stdin open until both responses arrive; closing it early makes the server exit mid-request.
        run: |
          python3 - <<'PY'
          import json, subprocess
          p = subprocess.Popen(["docker", "run", "-i", "--rm", "ucetka-mcp"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          def send(msg):
              p.stdin.write(json.dumps(msg) + "\n"); p.stdin.flush()
          def reply(want):
              for line in p.stdout:
                  msg = json.loads(line)
                  if msg.get("id") == want:
                      return msg["result"]
              raise SystemExit(f"server exited before answering request {want}")
          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "0"}}})
          info = reply(1)
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tools = reply(2)["tools"]
          p.stdin.close(); p.wait(timeout=60)
          print(info["serverInfo"], len(tools), "tools")
          assert info.get("instructions"), "missing instructions"
          assert len(tools) == 25, len(tools)
          PY
      - name: WeasyPrint renders a PDF
        run: >
          docker run --rm --entrypoint python ucetka-mcp -c
          "import weasyprint; assert weasyprint.HTML(string='<p>x</p>').write_pdf().startswith(b'%PDF-')"
