name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match package version '$version'" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      # uv publish understands Metadata-Version 2.5 written by uv build
      # (the twine bundled in pypa/gh-action-pypi-publish v1.12.4 rejects it).
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
