[project]
name = "ucetka-mcp"
version = "0.1.0"
description = "AI-native accounting for Czech freelancers: invoices (PDF/A-3 + ISDOC + QR Platba), VAT and EPO filings, income tax and insurance, driven from an AI chat via MCP"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Martin Kubánek" }]
license = "MIT"
keywords = ["mcp", "invoice", "isdoc", "qr-platba", "dph", "epo", "czech", "accounting"]
dependencies = [
    "pydantic>=2.7",
    "weasyprint>=62",
    "qrplatba[png]>=1.2",
    "lxml>=5",
    "pikepdf>=9",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
    "babel>=2.15",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "python-multipart>=0.0.28",
    "mcp[cli]>=1.27.1",
    "httpx>=0.28.1",
    "pdfplumber>=0.11",
]

[project.scripts]
ucetka = "ucetka.cli:app"
ucetka-mcp = "ucetka.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucetka"]

[tool.hatch.build]
include = ["src/ucetka/**/*.py", "src/ucetka/**/*.xsd", "src/ucetka/**/*.j2", "src/ucetka/**/*.css", "src/ucetka/**/*.html", "src/ucetka/**/*.yaml"]
